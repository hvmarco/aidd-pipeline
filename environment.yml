name: aidd
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # --- core scientific ---
  - numpy
  - pandas>=2.0
  - scipy
  - matplotlib
  - seaborn
  - tqdm
  - pyyaml
  - pyarrow            # parquet caching for per-stage outputs

  # --- cheminformatics core (conda-forge wheels available on Win/Mac/Linux) ---
  - rdkit>=2024.3
  - openbabel
  - biopython
  - pdbfixer            # receptor cleanup for notebook 09 (small-N MoA); pulls openmm

  # --- public-database lookups (variant priors notebook 07) ---
  - requests           # AlphaMissense download stream + gnomAD GraphQL POST

  # --- CPU docking baseline ---
  # AutoDock Vina has no conda-forge package for Windows. Install when needed via:
  #   - Colab: apt-get install autodock-vina (or use gnina)
  #   - Windows: download the .exe from https://vina.scripps.edu/ and put it on PATH
  #   - WSL/Linux/macOS: conda install -c bioconda autodock-vina
  # Local dev on Windows doesn't need a docker installed — docking notebooks invoke it on Colab.

  # --- in-notebook 3D visualisation ---
  - py3dmol

  # --- tabular ML ---
  - scikit-learn>=1.4
  - xgboost
  - lightgbm
  - imbalanced-learn

  # --- notebooks ---
  - jupyterlab>=4
  - ipykernel
  - ipywidgets
  - nbformat

  # --- dev quality ---
  - black
  - ruff
  - pytest

  # --- pip extras (faster moving / not always on conda-forge for Windows) ---
  - pip:
      - datamol             # RDKit wrapper with sensible defaults
      - meeko               # AutoDock-family ligand prep
      - gemmi               # structural biology I/O (required by recent meeko)
      - prolif>=2.0         # interaction fingerprints
      - posebusters         # automated pose QC
      - nbstripout          # strip notebook outputs pre-commit
